##### Core behavior #####

# Use Ctrl-a as prefix, easier than Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Faster escape for Vim/Neovim.
set -sg escape-time 10

# Bigger scrollback for long AI-agent outputs.
set -g history-limit 100000

# Start windows/panes at 1.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse support: resize panes, select panes, scroll.
set -g mouse on

# Better colors.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Keep working directory when opening new panes/windows.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

##### Navigation #####

# Vim-style pane movement.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Easier pane resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

##### Copy mode #####

setw -g mode-keys vi

# Enter copy mode.
bind [ copy-mode

# Copy selection using vi keys into tmux buffer.
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

##### Logging helpers #####

# Toggle logging current pane to ~/tmux-logs/
bind-key P run-shell 'mkdir -p ~/tmux-logs; tmux pipe-pane -o "cat >> ~/tmux-logs/#S-#W-#P-$(date +%%Y%%m%%d-%%H%%M%%S).log" \; display-message "Logging toggled for this pane"'

# Capture visible + scrollback history from current pane.
bind-key C-p run-shell 'mkdir -p ~/tmux-logs; tmux capture-pane -pS - > ~/tmux-logs/capture-#S-#W-#P-$(date +%%Y%%m%%d-%%H%%M%%S).txt \; display-message "Pane captured to ~/tmux-logs"'

##### Status bar #####

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "[#S] "
set -g status-right "#{pane_current_path} | %Y-%m-%d %H:%M"
setw -g window-status-current-format " #I:#W* "
setw -g window-status-format " #I:#W "